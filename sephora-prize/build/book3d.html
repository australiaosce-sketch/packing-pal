<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
:root{--W:1000px;--H:1220px;--D:150px;
 --foil:linear-gradient(165deg,#9c7a3a 0%,#e6c983 28%,#b8954d 45%,#f3dea3 55%,#a98640 72%,#d9bb72 100%);
 --stripes:linear-gradient(52deg,#8a1c1c 0 9%,#c8473a 9% 22%,#c06a22 22% 36%,#3e1a11 36% 52%,#a3171e 52% 66%,#d4551f 66% 81%,#7a2f1a 81% 100%)}
.stage{width:1800px;height:1800px;display:flex;align-items:center;justify-content:center;perspective:2800px}
.book{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;transform:rotateX(-8deg) rotateY(30deg)}
.f{position:absolute;backface-visibility:hidden}
.front{inset:0;transform:translateZ(calc(var(--D)/2));border-radius:3px 10px 10px 3px;overflow:hidden;background:var(--stripes);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.hinge{position:absolute;left:30px;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.12),rgba(0,0,0,.22))}
.sheen{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.2),transparent 32%,transparent 60%,rgba(0,0,0,.26))}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(40,10,0,.5))}
.txt{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:Poppins,sans-serif}
.t1{font-weight:500;font-size:250px;letter-spacing:.01em;line-height:.9}
.t2{font-weight:400;font-size:112px;letter-spacing:.02em;line-height:1;margin-top:4px}
.rule{width:66%;height:3px;background:#fff4ea;margin:26px auto 26px}
.t3{font-weight:500;font-size:48px;line-height:1.28;color:#fff8f1;text-shadow:0 1px 2px rgba(40,10,0,.4)}
.logo2{position:absolute;left:50%;bottom:60px;width:470px;transform:translateX(-50%);filter:drop-shadow(0 1px 1px rgba(40,10,0,.5))}
.back{inset:0;transform:rotateY(180deg) translateZ(calc(var(--D)/2));background:#3b1a12}
.spine{top:0;left:0;width:var(--D);height:var(--H);transform-origin:0 0;transform:rotateY(-90deg) translateX(calc(var(--D)/-2));overflow:hidden;border-radius:10px;
 background:linear-gradient(20deg,#7a2f1a 0 14%,#a3171e 14% 30%,#3e1a11 30% 44%,#c06a22 44% 60%,#c8473a 60% 78%,#8a1c1c 78% 100%)}
.spine:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 40%,rgba(0,0,0,.2) 80%,rgba(0,0,0,.5))}
.spine .v{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);white-space:nowrap;font-family:Poppins;z-index:2;display:flex;align-items:center;gap:30px}
.spine .v .s1{font-weight:500;font-size:88px}.spine .v .s2{font-size:52px}
.spine .v img{height:48px;margin-left:60px}
.pages{top:12px;right:0;width:calc(var(--D) - 20px);height:calc(var(--H) - 24px);transform-origin:100% 0;transform:rotateY(90deg) translateX(calc(var(--D)/2 - 10px));
 background:repeating-linear-gradient(90deg,#f6efe4 0 3px,#ddd2c3 3px 4px)}
.shadow{position:absolute;left:-80px;right:-160px;bottom:-110px;height:200px;background:radial-gradient(ellipse at 45% 50%,rgba(40,15,8,.5),transparent 68%);filter:blur(14px);transform:translateZ(-120px)}
</style></head><body><div class="stage"><div class="book">
<div class="shadow"></div><div class="f back"></div><div class="f pages"></div>
<div class="f spine"><div class="v"><span class="s1 foil">SKIN</span><span class="s2 foil">REVOLUTION</span><img src="img/logo_gold.png"></div></div>
<div class="f front"><div class="hinge"></div>
 <div class="txt"><div class="t1 foil">SKIN</div><div class="t2 foil">REVOLUTION</div><div class="rule"></div>
 <div class="t3">The Ultimate Guide to<br>Beautiful and Healthy<br>Skin of Colour</div></div>
 <img class="logo2" src="img/logo_gold.png"><div class="sheen"></div></div>
</div></div></body></html>
